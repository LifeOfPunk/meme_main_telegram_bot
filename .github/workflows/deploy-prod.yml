name: CD Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Гейт: деплой на прод не стартует без зелёного CI
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-prod:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Production to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="/opt/aiviral/viralapp-bot"
            echo "🚀 [PRODUCTION] Starting deploy in $DEPLOY_PATH..."
            cd "$DEPLOY_PATH"

            sudo chown -R aiviral_agency_gmail_com:aiviral_agency_gmail_com "$DEPLOY_PATH" || true
            git fetch origin main
            git reset --hard origin/main

            echo "⚙️ Syncing Caddyfile and reloading Caddy (single source of truth)..."
            if [ -f "infra/Caddyfile" ]; then
              sudo cp infra/Caddyfile /opt/aiviral/n8n/Caddyfile
              sudo docker exec n8n-caddy-1 caddy reload --config /etc/caddy/Caddyfile || echo "⚠️ Caddy reload skipped"
            fi

            echo "🐳 Pre-building Production Docker containers before switch..."
            sudo docker compose build bot admin backend

            echo "🔄 Rolling update containers..."
            sudo docker compose up -d --no-deps bot admin backend

            echo "⏳ Health check (backend /health, до 60с)..."
            ok=0
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3005/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 5
            done

            echo "📊 Production container status:"
            sudo docker compose ps
            echo "📋 Production bot logs:"
            sudo docker compose logs --tail 25 bot

            if [ "$ok" != "1" ]; then
              echo "❌ [PRODUCTION] Backend health check FAILED — деплой считается неуспешным"
              exit 1
            fi
            echo "✅ [PRODUCTION] Deploy complete and healthy!"
