name: CD Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Zero-Downtime Deploy to Production
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Production to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="/opt/aiviral/viralapp-bot"
            echo "🚀 [PRODUCTION] Starting zero-downtime deploy in $DEPLOY_PATH..."
            cd "$DEPLOY_PATH"

            echo "📦 Fetching latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Pre-building Production Docker containers before switch..."
            sudo docker compose build bot admin backend

            echo "🔄 Rolling update containers..."
            sudo docker compose up -d --no-deps bot admin backend

            echo "⏳ Waiting 5s for services..."
            sleep 5

            echo "📊 Production container status:"
            sudo docker compose ps

            echo "📋 Production bot logs:"
            sudo docker compose logs --tail 25 bot

            echo "✅ [PRODUCTION] Deploy complete and healthy!"
