name: CD Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Staging to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="/opt/aiviral/viralapp-staging"
            echo "🚀 [STAGING] Starting deploy in $DEPLOY_PATH..."
            cd "$DEPLOY_PATH"

            echo "📦 Fetching latest changes from staging branch..."
            git fetch origin staging
            git reset --hard origin/staging

            echo "🌐 Syncing static site pages..."
            if [ -d "site" ]; then
              sudo cp -r site/* /opt/aiviral/n8n/site/
            fi

            echo "🐳 Building and starting Staging containers..."
            sudo docker compose -f docker-compose.staging.yml build
            sudo docker compose -f docker-compose.staging.yml up -d --remove-orphans

            echo "⏳ Waiting 5s for services..."
            sleep 5

            echo "📊 Staging container status:"
            sudo docker compose -f docker-compose.staging.yml ps

            echo "📋 Staging bot logs:"
            sudo docker compose -f docker-compose.staging.yml logs --tail 25 bot

            echo "✅ [STAGING] Deploy complete!"
