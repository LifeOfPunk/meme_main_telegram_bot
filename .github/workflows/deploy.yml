name: CD Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_PATH || '/home/aiviral/memememe' }}"
            echo "🚀 Starting deployment in $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "📦 Fetching latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing production dependencies..."
            npm ci --omit=dev

            echo "🔍 Validating syntax before restart..."
            node scripts/check_syntax.js

            echo "🔄 Reloading PM2 processes..."
            if pm2 describe meemee-bot > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save

            echo "📊 Process status:"
            pm2 status

            echo "✅ Deployment successful!"
